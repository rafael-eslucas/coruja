<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav class="line">
            <img src="images/logo.jpg">
            <div class="line">
                <a href="#sobre">Sobre</a>
                <a href="login">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <h1>Pacientes</h1>
            <div>
                <div>
                    <h2>Registrar Paciente</h2>
                    <form id="addpatient">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required><br>
                        <label for="species">Species</label>
                        <input type="text" id="species" name="species" required><br>
                        <label for="breed">Breed</label>
                        <input type="text" id="breed" name="breed" required><br>
                        <label for="birth">Birth Date</label>
                        <input type="date" id="birth" name="birth"><br>
                        <label for="notes">Notes</label>
                        <input type="text" id="notes" name="notes"><br>
                        <label for="owner">Owner ID</label>
                        <input type="text" id="owner" name="owner" required><br>
                        <button type="submit">submit</button>
                    </form>
                </div>
                <div>
                    <h2>Registrar Tutor</h2>
                    <form id="addtutor">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required><br>

                        <label for="phone">Phone</label>
                        <input type="text" id="phone" name="phone"><br>

                        <label for="city">City</label>
                        <input type="text" id="city" name="city" required><br>

                        <label for="neighborhood">Neighborhood</label>
                        <input type="text" id="neighborhood" name="neighborhood" required><br>

                        <label for="street">Street</label>
                        <input type="text" id="street" name="street" required><br>

                        <label for="number">Number</label>
                        <input type="text" id="number" name="number" required><br>

                        <button type="submit">submit</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="patients.js"></script>
</body>
</html>
