<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="patients.css">
    <title>Document</title>
</head>
<body>
    <header>
        <nav class="line">
            <img src="images/logo.jpg">
            <div class="line">
                <a href="#sobre">Sobre</a>
                <a href="login">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <h1>Pacientes</h1>
            <div class="line">
                <div class="column">
                    <div class="line">
                        <div> <!-- Registrar Paciente -->
                            <h2>Registrar Paciente</h2>
                            <form id="addpatient">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" required><br>
                                <label for="species">Species</label>
                                <input type="text" id="species" name="species" required><br>
                                <label for="breed">Breed</label>
                                <input type="text" id="breed" name="breed" required><br>
                                <label for="birth">Birth Date</label>
                                <input type="date" id="birth" name="birth"><br>
                                <label for="notes">Notes</label>
                                <input type="text" id="notes" name="notes"><br>
                                <label for="owner">Owner ID</label>
                                <input type="text" id="owner" name="owner" required><br>
                                <button type="submit">submit</button>
                            </form>
                        </div>
                        <div> <!-- Registrar Tutor -->
                            <h2>Registrar Tutor</h2>
                            <form id="addtutor">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" required><br>

                                <label for="phone">Phone</label>
                                <input type="text" id="phone" name="phone"><br>

                                <label for="city">City</label>
                                <input type="text" id="city" name="city" required><br>

                                <label for="neighborhood">Neighborhood</label>
                                <input type="text" id="neighborhood" name="neighborhood" required><br>

                                <label for="street">Street</label>
                                <input type="text" id="street" name="street" required><br>

                                <label for="number">Number</label>
                                <input type="text" id="number" name="number" required><br>

                                <button type="submit">submit</button>
                            </form>
                        </div>
                    </div>
                    <div class="line">
                        <div> <!-- Editar Paciente -->
                            <h2>Editar Paciente</h2>
                            <form id="editpatient">
                                <label for="id">ID</label>
                                <input type="text" id="id" name="id" required><br>
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" required><br>
                                <label for="species">Species</label>
                                <input type="text" id="species" name="species" required><br>
                                <label for="breed">Breed</label>
                                <input type="text" id="breed" name="breed" required><br>
                                <label for="birth">Birth Date</label>
                                <input type="date" id="birth" name="birth"><br>
                                <label for="notes">Notes</label>
                                <input type="text" id="notes" name="notes"><br>
                                <label for="owner">Owner ID</label>
                                <input type="text" id="owner" name="owner" required><br>
                                <button type="submit">submit</button>
                            </form>
                        </div>
                        <div> <!-- Editar Tutor -->
                            <h2>Editar Tutor</h2>
                            <form id="edittutor">
                                <label for="id">ID</label>
                                <input type="text" id="id" name="id" required><br>

                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" required><br>

                                <label for="phone">Phone</label>
                                <input type="text" id="phone" name="phone"><br>

                                <label for="city">City</label>
                                <input type="text" id="city" name="city" required><br>

                                <label for="neighborhood">Neighborhood</label>
                                <input type="text" id="neighborhood" name="neighborhood" required><br>

                                <label for="street">Street</label>
                                <input type="text" id="street" name="street" required><br>

                                <label for="number">Number</label>
                                <input type="text" id="number" name="number" required><br>

                                <button type="submit">submit</button>
                            </form>
                        </div>
                    </div>
                    <div class="line">
                        <div> <!-- Pesquisar Paciente -->
                            <h2>Pesquisar Paciente</h2>
                            <form id="getpatient">
                                <label for="row">Coluna</label>
                                <select name="row" id="row" required>
                                    <option value="">Selecione</option>
                                    <option value="name">Nome</option>
                                    <option value="species">Espécie</option>
                                    <option value="breed">Raça</option>
                                    <option value="owner_id">Owner ID</option>
                                </select><br>
                                <label for="value">Valor</label>
                                <input type="text" id="value" name="value" required><br>
                                <button type="submit">submit</button>
                            </form>
                        </div>
                        <div> <!-- Pesquisar Tutor -->
                            <h2>Pesquisar Tutor</h2>
                            <form id="gettutor">
                                <label for="row">Coluna</label>
                                <select name="row" id="row" required>
                                    <option value="">Selecione</option>
                                    <option value="id">ID</option>
                                    <option value="name">Nome</option>
                                    <option value="phone">Telefone</option>
                                    <option value="city">Cidade</option>
                                    <option value="neighborhood">Bairro</option>
                                    <option value="street">Rua</option>
                                    <option value="number">Número</option>
                                </select><br>
                                <label for="value">Valor</label>
                                <input type="text" id="value" name="value" required><br>
                                <button type="submit">submit</button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class=column id="answer">
                </div>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="patients.js"></script>
</body>
</html>
